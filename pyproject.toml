[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-ip-history"
version = "1.1.0"
description = "NetBox plugin unifying native and imported IP address lifecycle history."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Murat Bulat" }]
keywords = ["netbox", "netbox-plugin", "ipam", "ip-history", "audit"]
# No runtime dependencies: Django, DRF and friends are provided by the host NetBox.
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/muratbulat/netbox-ip-history"
Source = "https://github.com/muratbulat/netbox-ip-history"
Issues = "https://github.com/muratbulat/netbox-ip-history/issues"
Changelog = "https://github.com/muratbulat/netbox-ip-history/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["netbox_ip_history*"]

[tool.setuptools.package-data]
netbox_ip_history = ["templates/**/*.html", "locale/**/*.mo", "locale/**/*.po"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["netbox_ip_history/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["S101", "S308", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["netbox_ip_history"]
known-third-party = ["netbox", "utilities", "ipam", "dcim", "virtualization", "core", "extras", "users", "tenancy"]
