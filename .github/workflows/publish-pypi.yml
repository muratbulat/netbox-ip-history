name: Publish PyPI package

on:
  release:
    types: [published]
  # Exercises `verify` on demand; `publish` only runs for a real release.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U netbox -d netbox"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Releases must be cut from main
        if: github.event_name == 'release'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag $GITHUB_REF_NAME is not on main; refusing to publish."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build twine
      - name: Version consistency (including the release tag)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/verify_release.py versions ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/verify_release.py package dist/*.whl dist/*.tar.gz
      - name: Test the built wheel inside NetBox
        run: |
          git clone --depth 1 --branch v4.7.3 https://github.com/netbox-community/netbox.git /tmp/netbox
          python -m pip install -r /tmp/netbox/requirements.txt
          python -m pip install dist/*.whl
          cat > /tmp/netbox/netbox/netbox/configuration.py <<'EOF'
          ALLOWED_HOSTS = ["*"]
          SECRET_KEY = "ci-only-secret-key-for-tests-only-and-never-for-production-use-1234567890"
          DATABASE = {"NAME": "netbox", "USER": "netbox", "PASSWORD": "netbox", "HOST": "127.0.0.1", "PORT": "5432"}
          REDIS = {
              "tasks": {"HOST": "127.0.0.1", "PORT": 6379, "DATABASE": 0, "SSL": False},
              "caching": {"HOST": "127.0.0.1", "PORT": 6379, "DATABASE": 1, "SSL": False},
          }
          PLUGINS = ["netbox_ip_history"]
          EOF
          cd /tmp/netbox/netbox
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations netbox_ip_history --check --dry-run
          DJANGO_SETTINGS_MODULE=netbox.settings PYTHONPATH=. python "$GITHUB_WORKSPACE/tools/run_tests.py" "$GITHUB_WORKSPACE/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/netbox-ip-history/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
