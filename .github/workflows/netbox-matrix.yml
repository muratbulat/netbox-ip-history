name: NetBox compatibility

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  integration:
    name: NetBox ${{ matrix.netbox }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { netbox: v4.7.0, python: "3.12", experimental: false }
          - { netbox: v4.7.3, python: "3.14", experimental: false }
          # Early warning for the next NetBox release; never blocks a merge.
          - { netbox: main, python: "3.14", experimental: true }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U netbox -d netbox"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the plugin wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install NetBox and the built wheel (not the source tree)
        run: |
          git clone --depth 1 --branch "${{ matrix.netbox }}" https://github.com/netbox-community/netbox.git /tmp/netbox
          python -m pip install -r /tmp/netbox/requirements.txt coverage
          python -m pip install dist/*.whl
          cd /tmp && python -c "import importlib.util as u; o = u.find_spec('netbox_ip_history').origin; assert 'site-packages' in o, o"
      - name: Configure NetBox
        working-directory: /tmp/netbox/netbox/netbox
        run: |
          cat > configuration.py <<'EOF'
          ALLOWED_HOSTS = ["*"]
          SECRET_KEY = "ci-only-secret-key-for-tests-only-and-never-for-production-use-1234567890"
          DATABASE = {"NAME": "netbox", "USER": "netbox", "PASSWORD": "netbox", "HOST": "127.0.0.1", "PORT": "5432"}
          REDIS = {
              "tasks": {"HOST": "127.0.0.1", "PORT": 6379, "DATABASE": 0, "SSL": False},
              "caching": {"HOST": "127.0.0.1", "PORT": 6379, "DATABASE": 1, "SSL": False},
          }
          PLUGINS = ["netbox_ip_history"]
          EOF
      - name: Check, migrate, and verify no migration drift
        working-directory: /tmp/netbox/netbox
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations netbox_ip_history --check --dry-run
      - name: Run plugin tests
        working-directory: /tmp/netbox/netbox
        env:
          DJANGO_SETTINGS_MODULE: netbox.settings
          PYTHONPATH: .
        run: |
          python -m coverage run --source=netbox_ip_history "$GITHUB_WORKSPACE/tools/run_tests.py" "$GITHUB_WORKSPACE/tests"
          python -m coverage report -m
