name: Importer request
description: Request support for an IPAM/DDI/DCIM source
title: "importer: "
body:
  - type: input
    id: product
    attributes:
      label: Product and version
    validations:
      required: true
  - type: input
    id: api
    attributes:
      label: API or export version
  - type: textarea
    id: formats
    attributes:
      label: Available formats and desired inventory/history data
  - type: textarea
    id: sample
    attributes:
      label: Sanitized sample schema
      description: Do not attach passwords, API tokens, production database dumps, or sensitive exports.
  - type: textarea
    id: scope
    attributes:
      label: VRF, IP-space, and scope behavior
