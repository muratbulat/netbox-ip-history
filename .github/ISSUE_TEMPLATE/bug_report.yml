name: Bug report
description: Report a reproducible problem
title: "bug: "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: NetBox version, Python version, plugin version, and deployment method.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data
      options:
        - label: I have removed passwords, API tokens, production database dumps, and sensitive exports.
          required: true
